name: Wrapper regressions

on:
  push:
  pull_request:

jobs:
  regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install test dependency
        run: python -m pip install numpy
      - name: Run model-free wrapper regressions
        run: python -m unittest tests.test_output_preservation -v
